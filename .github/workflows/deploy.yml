# Auto deploy to VPS — Baby Tracker (aira.teknodika.com)
# The image is built on the GitHub runner (7 GB RAM). The 1.7 GB VPS only
# loads that image and restarts the app container.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t aira-tracker:release .

      - name: Save image archive
        run: docker save aira-tracker:release | gzip -1 > aira-tracker-image.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: aira-tracker-image.tar.gz
          target: /tmp
          overwrite: true
          timeout: 30m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/apps/aira-tracker"; fi
            cd "$APP_DIR"
            if [ ! -f deploy/git-sync.sh ]; then
              echo "==> Bootstrap: pulling latest main (deploy scripts not on VPS yet)..."
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            fi
            chmod +x deploy/git-sync.sh deploy/docker-deploy.sh
            bash deploy/git-sync.sh
            bash deploy/docker-deploy.sh
